<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>

<body>
<title>Repair Matrix Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column — search field on top, suggestions drop under it, result sheet below */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --line:#d9dee4; --fg:#18212b; --muted:#5d6a78;
  --accent:#0b6e8a; --accent-soft:#e2f0f4; --hover:#eef2f5; --mark:#18212b;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2128; --line:#2d3740; --fg:#e6ebf0; --muted:#93a1ae;
  --accent:#4fb6d3; --accent-soft:#16323b; --hover:#232c35; --mark:#e6ebf0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2128; --line:#2d3740; --fg:#e6ebf0; --muted:#93a1ae;
  --accent:#4fb6d3; --accent-soft:#16323b; --hover:#232c35; --mark:#e6ebf0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:4px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:13.5px}
.src{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:12.5px;color:var(--muted)}
.src b{font-family:var(--mono);font-weight:500;color:var(--fg)}
.src label{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.src label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
#file{position:absolute;opacity:0;width:1px;height:1px}
.search{position:relative}
.box{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:0 18px;height:52px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.box:focus-within{border-color:var(--accent)}
.search.open .box{border-radius:26px 26px 0 0;border-bottom-color:transparent;box-shadow:0 2px 10px rgba(0,0,0,.10)}
.box svg{flex:none;color:var(--muted)}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:16.5px;height:100%}
#clear{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:4px;border-radius:50%}
#clear:focus-visible{outline:2px solid var(--accent)}
.list{position:absolute;left:0;right:0;top:52px;z-index:5;background:var(--surface);border:1px solid var(--accent);border-top:1px solid var(--line);border-radius:0 0 22px 22px;box-shadow:0 8px 16px rgba(0,0,0,.10);margin:0;padding:6px 0 10px;list-style:none;max-height:min(60vh,440px);overflow-y:auto}
.list li{display:flex;align-items:center;gap:14px;padding:8px 18px;cursor:pointer}
.list li[aria-selected="true"],.list li:hover{background:var(--hover)}
.list li svg{flex:none;color:var(--muted)}
.list .name{flex:1;min-width:0;font-weight:700}
.list .name span{font-weight:400}
.list .sec{flex:none;font-size:12px;color:var(--muted);max-width:42%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .none{cursor:default;color:var(--muted)}
.list .none:hover{background:none}
.recent{display:flex;flex-direction:column;gap:8px}
.recent-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.recent-h h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#recent-clear{font:inherit;font-size:12.5px;color:var(--muted);background:none;border:0;cursor:pointer;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
#recent-clear:hover{color:var(--accent)}
#recent-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#recent-list:empty{display:none}
#recent-list li+li{border-top:1px solid var(--line)}
#recent-list button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;padding:11px 18px;cursor:pointer}
#recent-list button:hover{background:var(--hover)}
#recent-list button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#recent-list svg{flex:none;color:var(--muted)}
#recent-list .name{flex:1;min-width:0;font-weight:600}
#recent-list .sec{flex:none;font-size:12px;color:var(--muted);max-width:42%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-empty{margin:0;color:var(--muted);font-size:13.5px;padding:18px;border:1px dashed var(--line);border-radius:14px;text-align:center}
@media (max-width:480px){#recent-list .sec{display:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.chips button{font:inherit;font-size:13px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 12px;cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.chips button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.result{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted)}
.tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:2px 7px}
.result h2{margin:0;font-size:21px;font-weight:700;line-height:1.35;text-wrap:balance}
.count{font-size:13px;color:var(--muted)}
.tests{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.tests li{display:flex;gap:12px;align-items:baseline;padding:10px 2px;border-bottom:1px solid var(--line)}
.tests li::before{content:"◆";color:var(--mark);font-size:13px;flex:none;width:14px}
.tests li.std{font-weight:600}
.tools-h{margin:10px 0 0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tools{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tools li{display:flex;flex-direction:column;gap:2px;background:var(--accent-soft);border-radius:10px;padding:10px 14px}
.tools .tn{font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px}
.tools .tn svg{flex:none}
.tools .for{font-size:12.5px;color:var(--muted)}
.tests li .tt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--accent);white-space:nowrap}
.imgs{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.imgs figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.imgs img{display:block;width:100%;height:auto}
.imgs figcaption{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:6px 12px;border-top:1px solid var(--line)}
.imgs .pic{position:relative;line-height:0;background:#fff}
.imgs .fld{position:absolute;display:flex;align-items:center;justify-content:center;line-height:1;font-family:Arial,var(--sans);font-weight:600;color:#10233a;font-size:clamp(9px,2.3vw,17px);font-variant-numeric:tabular-nums}
.imgs .ph{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;max-width:100%;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px;background:var(--bg)}
.empty{color:var(--muted);font-size:14px;padding:6px 0 0}
.result.placeholder{border-style:dashed;color:var(--muted);text-align:center;padding:36px 24px}
@media (max-width:480px){.list .sec{display:none}.result{padding:18px}}
@media (prefers-reduced-motion:no-preference){.result{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

      const rows=data[i3].rows.map((r,k)=>{const all=[...r[1],...data[i4].rows[k][1]];const u=[...new Set(all)];return [r[0],[...STDL.filter(x=>u.includes(x)),...u.filter(x=>!STDL.includes(x))]];});
      data[i3]={sheet:'Page 3-4',section:'Top Level Sub-Rack',rows};data.splice(i4,1);
    }
    if(!data.length) throw new Error('empty');
    load({sheets:data,tools,images});document.getElementById('srcname').textContent=f.name;$q.value='';$clear.hidden=true;close();home();
  }catch(err){
    $out.innerHTML=`<div class="result placeholder">이 파일을 읽지 못했어요. A열에 부품 이름, 1행에 테스트 이름, 칸에 ◆가 있는 엑셀인지(도구는 Tools 시트) 확인해 주세요.</div>`;
  }
  e.target.value='';
});
load(DEFAULT_DATA);
home();
</script>
